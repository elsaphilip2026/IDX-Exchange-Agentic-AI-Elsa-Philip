
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDX Exchange AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }
    header {
      background: #132746;
      color: white;
      padding: 22px 24px;
    }
    header h1 { margin: 0 0 6px; font-size: 24px; }
    header p { margin: 0; color: #d3dfef; font-size: 14px; }
    main {
      max-width: 900px;
      margin: 28px auto;
      padding: 0 16px;
    }
    .panel {
      background: white;
      border: 1px solid #e0e6ef;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 28px #1c31500d;
    }
    #messages {
      min-height: 340px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 22px;
    }
    .message {
      margin: 0 0 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .assistant strong { color: #176b54; }
    .user strong { color: #315fc2; }
    .composer {
      border-top: 1px solid #e0e6ef;
      padding: 16px;
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      min-width: 0;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 13px;
      font-size: 15px;
    }
    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      background: #2459c4;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .examples {
      color: #526078;
      font-size: 13px;
      padding: 16px 22px 20px;
    }
    .examples button {
      margin: 8px 5px 0 0;
      background: #edf2fb;
      color: #234b91;
      padding: 9px 12px;
    }
    .property {
      margin-top: 10px;
      border: 1px solid #e0e6ef;
      border-radius: 9px;
      padding: 12px;
      background: #fafcff;
    }
    .property h3 { margin: 0 0 7px; font-size: 15px; }
    .property p { margin: 4px 0; font-size: 13px; color: #526078; }
    .reset { background: #536174; }
    footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin: 18px;
    }
    @media (max-width: 520px) {
      .composer { flex-wrap: wrap; }
      .composer input { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🏠 IDX Exchange AI</h1>
    <p>Conversational real estate search powered by MLS data</p>
  </header>

  <main>
    <section class="panel">
      <div id="messages" aria-live="polite">
        <div class="message assistant">
          <strong>IDX Assistant</strong>
          Hello! I can help you find properties using natural language.
          Try asking for homes in a city, then refine your search by price,
          bedrooms, or pool.
        </div>
      </div>

      <form id="chatForm" class="composer">
        <input id="messageInput" autocomplete="off"
          placeholder="Try: Find 3-bedroom homes in Irvine"
          aria-label="Your property search" required />
        <button id="sendButton" type="submit">Send</button>
        <button id="resetButton" class="reset" type="button">New search</button>
      </form>

      <div class="examples">
        Try an example:
        <br />
        <button type="button" data-message="Find homes in Irvine">Homes in Irvine</button>
        <button type="button" data-message="Under $1.2M">Under $1.2M</button>
        <button type="button" data-message="At least 3 bedrooms">3+ bedrooms</button>
        <button type="button" data-message="With a pool">With a pool</button>
      </div>
    </section>

    <footer>IDX Exchange Agentic AI · Internship Demo</footer>
  </main>

  <script>
    let sessionId = null;

    const messages = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    function addMessage(role, text, properties = []) {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}`;

      const label = document.createElement("strong");
      label.textContent = role === "user" ? "You" : "IDX Assistant";
      wrapper.appendChild(label);

      const content = document.createElement("div");
      content.textContent = text;
      wrapper.appendChild(content);

      for (const property of properties) {
        const card = document.createElement("div");
        card.className = "property";

        const title = document.createElement("h3");
        title.textContent = `${property.address || "Address unavailable"}, ${property.city || ""}`;
        card.appendChild(title);

        const details = document.createElement("p");
        const price = Number(property.price);
        details.textContent =
          `${Number.isFinite(price) ? price.toLocaleString("en-US", {
            style: "currency", currency: "USD", maximumFractionDigits: 0
          }) : "Price unavailable"} · ${property.bedrooms ?? "?"} beds · ` +
          `${property.bathrooms ?? "?"} baths · ` +
          `${property.sqft ? Number(property.sqft).toLocaleString() + " sqft" : "Size unavailable"}`;
        card.appendChild(details);
        wrapper.appendChild(card);
      }

      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage(message) {
      if (!message.trim()) return;

      addMessage("user", message);
      input.value = "";
      sendButton.disabled = true;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, sessionId })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed.");

        sessionId = data.sessionId || sessionId;
        addMessage("assistant", data.reply || "No response received.", data.properties || []);
      } catch (error) {
        addMessage("assistant", `Sorry, the search failed: ${error.message}`);
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(input.value);
    });

    document.querySelectorAll("[data-message]").forEach((button) => {
      button.addEventListener("click", () => sendMessage(button.dataset.message));
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      sendMessage("new search");
    });
  </script>
</body>
</html>
